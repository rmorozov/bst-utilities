name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unit:
    name: Unit (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev]' build
      - run: python scripts/tasks.py check
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -m 'not integration'
      - run: python -m build
      - run: bst-source-grep --help
  buildstream:
    name: BuildStream (${{ matrix.bst }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        bst: ['BuildStream==2.8.0', 'BuildStream>=2.8,<3']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y bubblewrap fuse3 ripgrep
      - run: python -m pip install -e '.[dev]' '${{ matrix.bst }}'
      - run: bst --version
      - run: test -c /dev/fuse && test -r /dev/fuse && test -w /dev/fuse
      - run: pytest -ra
        env:
          BST_UTILITIES_REQUIRE_FUSE: 1
