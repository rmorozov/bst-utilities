name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-24.04
    outputs:
      full: ${{ steps.filter.outputs.full }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: filter
        run: python scripts/ci_changes.py
  docs:
    name: Documentation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'pytest>=8,<10' 'ruff>=0.11,<0.17'
      - run: python scripts/tasks.py check
      - run: ruff check scripts/tasks.py scripts/ci_changes.py tests/test_task_registry.py tests/test_ci_changes.py
      - run: ruff format --check scripts/tasks.py scripts/ci_changes.py tests/test_task_registry.py tests/test_ci_changes.py
      - run: pytest tests/test_task_registry.py tests/test_ci_changes.py
  unit:
    needs: changes
    if: needs.changes.outputs.full == 'true'
    name: Unit (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev]' build
      - run: python scripts/tasks.py check
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -m 'not integration'
      - run: python -m build
      - run: bst-source-grep --help
  buildstream:
    needs: changes
    if: needs.changes.outputs.full == 'true'
    name: BuildStream (${{ matrix.bst }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        bst: ['BuildStream==2.8.0', 'BuildStream>=2.8,<3']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y bubblewrap fuse3 ripgrep
      - run: python -m pip install -e '.[dev]' '${{ matrix.bst }}'
      - run: bst --version
      - run: test -c /dev/fuse && test -r /dev/fuse && test -w /dev/fuse
      - run: pytest -ra
        env:
          BST_UTILITIES_REQUIRE_FUSE: 1
  result:
    name: CI result
    if: always()
    needs: [changes, docs, unit, buildstream]
    runs-on: ubuntu-24.04
    steps:
      - name: Require the selected checks to pass
        env:
          CHANGES: ${{ needs.changes.result }}
          DOCS: ${{ needs.docs.result }}
          FULL: ${{ needs.changes.outputs.full }}
          UNIT: ${{ needs.unit.result }}
          BUILDSTREAM: ${{ needs.buildstream.result }}
        run: |
          test "$CHANGES" = success
          test "$DOCS" = success
          if [ "$FULL" = true ]; then
            test "$UNIT" = success
            test "$BUILDSTREAM" = success
          else
            test "$FULL" = false
            test "$UNIT" = skipped
            test "$BUILDSTREAM" = skipped
          fi
