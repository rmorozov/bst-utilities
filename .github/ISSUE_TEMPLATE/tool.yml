name: Tool request or bug
description: Propose a helper or report a BuildStream interaction problem
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or workflow
      description: Include reproduction steps and current behavior for bugs.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior and acceptance criteria
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: BuildStream, Python and OS versions
